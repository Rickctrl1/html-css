<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formúlario</title>
</head>
<body>
    <h1>Teste de formúlario</h1>
    <form action="cadastro.php" autocomplete="off" method="post">
        <p>
            <label for="iusu">Usuário: <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="10" ></label> <!--required = campo obrigatório-->
        </p>

        <p>
            <label for="isen">Senha: 
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" ></label>
        </p>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

        </p>
    </form>
</body>
</html>
<!-- name e id. name= html e php, id= js e label -->
<!-- required = campo obrigatório -->
<!-- minlength = número mínimo -->
<!-- maxlength = número máx -->
