<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>    
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome: <input type="text" name="Nome" id="inome"></label>
            </p>
            <p>
                <label for="iemail">E-mail:
                <input type="email" name="email" id="iemail"></label>
            </p>
            <p>
                <label for="itel">Telefone: <input type="tel" name="tel" id="itel" autocomplete="tel" required></label>
            </p>    
        </fieldset>
        <!--Estudar mais sobre RegEx-->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    
    </form>
</body>
</html>
