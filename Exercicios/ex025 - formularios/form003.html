<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulário</title>
</head>
<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.php" autocomplete="off" method="get">

        <p>
            <label for="inome">nome: <input type="text" name="nome" id="inome" required maxlength="30" placeholder="primeiro nome" autocomplete="name"></label>
        </p>
        <p>
            <label for="imedia">Média: <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1"></label>
        </p>
        <p>
            <label for="imes">Período Letivo: <input type="month" name="mes" id="imes"></label>
        </p>
        <p>
            <label for="idia">Dia da prova: <input type="date" name="dia" id="idia"></label>
        </p>
        <p>
            <label for="ihora">Horário da Prova: <input type="time" name="ihora" id="ihora"></label>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
