<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body{
            background-color: lightsalmon;
        }

        main{   /*pai*/
            background-color: lightgreen;
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-flow: row nowrap; /*não muda nada visualmente*/
            justify-content: center;
            align-items: center;
        }

        section{ /*filho*/
            background-color: lightskyblue;
            text-align: center;
            height: 200px;
            width: 200px;

        }
        section img{
            height: 200px;
            
        }
    </style>
</head>
<body>
    <main>
        <section>
            <img src="../1.jpg" alt="">
        </section>
    </main>
</body>
</html>
