<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;  /* largura */
            height: 400px;  /*altura*/
        }

        td{
            border: 1px solid black;
            padding: 8px;
            border-collapse: collapse;  /* junta as linhas da tabela */
            text-align: center;  /* alinhamento horizontal */
            vertical-align: middle; /* alinhamneto vertical */
        }
        
        .numero{
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--HIERARQUIA DE TABELAS  (simples)
    TABLE = tabela 
            TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela-->

    <!-- sempre respeitar a hierarquia das tabelas senão os dados podem vim antes ou depois da tanela -->

    <table>
        <tr>    <!-- Primeira linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>    <!-- Segunda linha -->  
            <td>A2</td>
            <td>B2</td>
            <td class="numero">500</td>
        </tr>
        <tr>    <!-- Terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td class="numero">500</td>
        </tr>
        <tr>    <!-- Quarta linha -->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>

    </table>

</body>
</html>
