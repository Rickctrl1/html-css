<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
        }

        tr.linha1{
            background-color: gray;
        }

        tr.linha3{
            background-color: gray;
        }

        td{
            border: 1px solid black;
            padding: 8px;
            border-collapse: collapse;  /* junta as linhas da tabela */
        }

        td.dado1{
            background-color: chocolate;
        }
        
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--HIERARQUIA DE TABELAS  (simples)
    TABLE = tabela 
            TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela-->

    <!-- sempre respeitar a hierarquia das tabelas senão os dados podem vim antes ou depois da tanela -->

    <table>
        <tr class="linha1">    <!-- Primeira linha -->
            <td class="dado2">A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha2">    <!-- Segunda linha -->  
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="linha3">    <!-- Terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>    <!-- Quarta linha -->
            <td>A4</td>
            <td>B4</td>
            <td class="dado1">C4</td>
        </tr>

    </table>

    <br>

    <table>
        <h2>Exemplo de não obediência da hierarquia das tabelas </h2>
            <table>
            <td class="linha1">    <!-- Primeira linha -->
                <td class="dado2">A1</td>
                <td>B1</td>
                <td>C1</td>
            </td>
            <tr class="linha2">    <!-- Segunda linha -->
                <td>A2</td>
                <tr>B2</tr>
                <td>C2</td>
            </tr>
            <tr class="linha3">    <!-- Terceira linha -->
                <td>A3</td>
                <td>B3</td>
                <td>C3</td>
    </table>

</body>
</html>
